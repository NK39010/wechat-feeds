# 公众号 → reMarkable 同步配置
# 本机 We-MP-RSS 抓到的文章 → 清洗排版、图片按墨水屏处理 → 每个公众号一个 feed → 推送到 GitHub → GitHub Pages

[source]
werss_url = "http://localhost:8001"   # We-MP-RSS 地址
items_per_feed = 30                   # 每个公众号 feed 保留的文章数
# 只同步这些公众号（填 We-MP-RSS 里显示的名称）；留空 = 同步全部
only = []

[refresh]
# 由本脚本触发 We-MP-RSS 更新公众号（代替它自带的定时任务：当前版本会把 MP_WXS_ 号强制走微信读书模式而跳过）
# 需要在 We-MP-RSS 管理页创建 Access Key，填到同目录的 secrets.toml（不会提交到仓库）
enabled = true
# 在这个时间（北京时间）之前不触发任何更新，用来让被微信限频的账号恢复；留空 = 不暂停
paused_until = ""
# We-MP-RSS 现为微信读书模式（公众号后台接口被微信风控）：每次只返回每个号的最新一篇，
# 所以每小时把所有号都查一遍，否则一天发多篇的号会漏。每个号约 1-2 个请求，走微信读书接口
min_hours = 1         # 每个公众号至少隔这么久才更新一次
max_per_run = 20      # 每次运行最多更新几个号（大于公众号数量 = 每次全部更新）
gap_seconds = 20      # 两个号之间的间隔

[site]
# GitHub Pages 地址（仓库名不同就改最后一段）
site_url = "https://nk39010.github.io/wechat-feeds/"
# 输出子目录。仓库是公开的，这里只是分个目录，不起保密作用；留空会自动生成随机字符串
secret_path = "feeds"

[images]
# 针对 reMarkable 2（1404px 宽灰度屏）。公众号图片有防盗链，必须下载后重新托管
max_width = 1404
grayscale = true
gray_gamma = 1.7      # 压暗中间调，浅色字不发白（1.0 = 不处理）
sharpen = true        # 缩小后轻度锐化
quality = 90
min_width = 40        # 比这更窄的图（分隔线、小图标）直接丢掉

[git]
push = true           # 同步完自动 commit + push
