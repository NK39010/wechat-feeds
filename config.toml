# 公众号 → reMarkable 同步配置
# 本机 We-MP-RSS 抓到的文章 → 清洗排版、图片按墨水屏处理 → 每个公众号一个 feed → 推送到 GitHub → GitHub Pages

[source]
werss_url = "http://localhost:8001"   # We-MP-RSS 地址
items_per_feed = 30                   # 每个公众号 feed 保留的文章数
# 只同步这些公众号（填 We-MP-RSS 里显示的名称）；留空 = 同步全部
only = []

[site]
# GitHub Pages 地址（仓库名不同就改最后一段）
site_url = "https://nk39010.github.io/wechat-feeds/"
# 输出子目录。仓库是公开的，这里只是分个目录，不起保密作用；留空会自动生成随机字符串
secret_path = "feeds"

[images]
# 针对 reMarkable 2（1404px 宽灰度屏）。公众号图片有防盗链，必须下载后重新托管
max_width = 1404
grayscale = true
gray_gamma = 1.7      # 压暗中间调，浅色字不发白（1.0 = 不处理）
sharpen = true        # 缩小后轻度锐化
quality = 90
min_width = 40        # 比这更窄的图（分隔线、小图标）直接丢掉

[git]
push = true           # 同步完自动 commit + push
